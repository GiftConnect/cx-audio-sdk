plugins {
    id "com.android.library"
    id "com.vanniktech.maven.publish"
}

android {
    namespace "com.cx.audio.android"
    compileSdk 35

    defaultConfig {
        minSdk 23
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

mavenPublishing {
    coordinates("io.github.giftconnect", "cx-audio-sdk", "0.1.0")

    publishToMavenCentral()
    signAllPublications()

    pom {
        name = "CX Audio SDK"
        description = "Android SDK for integrating CX audio ad placements."
        inceptionYear = "2026"
        url = "https://github.com/GiftConnect/cx-audio-sdk"

        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "https://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }

        developers {
            developer {
                id = "giftconnect"
                name = "Consumable"
                url = "https://github.com/GiftConnect"
            }
        }

        scm {
            url = "https://github.com/GiftConnect/cx-audio-sdk"
            connection = "scm:git:git://github.com/GiftConnect/cx-audio-sdk.git"
            developerConnection = "scm:git:ssh://git@github.com/GiftConnect/cx-audio-sdk.git"
        }
    }
}
