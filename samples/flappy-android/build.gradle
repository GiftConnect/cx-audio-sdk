plugins {
    id "com.android.application"
}

def placementHash = providers.gradleProperty("cxPlacementHash")
        .orElse("YOUR_PLACEMENT_HASH")
        .get()
        .replace("\\", "\\\\")
        .replace('"', '\\"')

android {
    namespace "com.cx.audio.samples.flappy"
    compileSdk 35

    defaultConfig {
        applicationId "com.cx.audio.samples.flappy"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.2"
        buildConfigField "String", "CX_PLACEMENT_HASH", "\"${placementHash}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(":android")
    implementation "com.google.android.gms:play-services-ads-identifier:18.0.1"
}
