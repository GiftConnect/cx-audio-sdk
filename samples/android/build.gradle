plugins {
    id "com.android.application"
}

android {
    namespace "com.cx.audio.sample"
    compileSdk 35

    defaultConfig {
        applicationId "com.cx.audio.sample"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(":android")
}
